web_blurb: In English books the word computer moved from people to machines in the 1950s, two decades before
  the four-colour theorem and while human computers were still employed; in 2026 the word mathematician shows
  the contrastive marking that preceded that shift without its first step, since machines are not yet called
  mathematicians. Five separable transitions, the 2026 record of machine mathematics, and three falsifiable
  claims for 2036.

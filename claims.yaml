- id: s-nasa
  kind: source
  passage: At the Langley laboratory of the National Advisory Committee for Aeronautics, "computer" was a job title
    for people who performed calculations by hand; hundreds of women, most of them with degrees in mathematics or
    the sciences, worked as computers there, and African-American women were grouped in a segregated section, the
    West Area Computers [@nasa2016; @shetterly2016].
  evidence:
    citation_id: nasa2016
    locator: Text
    verification_note: 'Page read 2026-10-08: "computer" was a job title for people who performed calculations by
      hand; hundreds of women, most with degrees in math or other sciences; West Area Computers in a segregated
      section.'
    verified: true

- id: s-appel
  kind: source
  passage: The four-colour theorem was announced in 1976 [@appel1976], and its proof depended on computation that
    no person could check by hand; 2036 is a date in the future, chosen because it lies sixty years after 1976 and
    a century after Turing's analysis of computation, which modelled the machine on a person working with pencil
    and paper [@turing1936].
  evidence:
    citation_id: appel1976
    locator: Abstract
    verification_note: 'Abstract: every planar map can be colored with at most four colors; the full proof appears
      in two papers, Part II with Koch.'
    verified: true
